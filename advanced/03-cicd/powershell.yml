name: PowerShell CI

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '.github/workflows/powershell.yml'

permissions:
  contents: read

jobs:
  test-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PowerShell
        uses: PowerShell/PowerShell@v1
        with:
          version: '7.4'
      - name: Parse scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psm1
          foreach ($file in $files) {
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Parse errors in $($file.FullName)" }
          }
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning
